include /etc/nginx/modules/*.conf;

user  nginx;

worker_processes auto;
worker_shutdown_timeout 120s;
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


http {
    aio             threads;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Betriebslogs ohne Client-IP, Querystring, Cookies und Anfrageinhalt.
    log_format main escape=json '{"log_type":"access","timestamp":"$time_iso8601","service":"nginx",'
        '"method":"$request_method","path":"$uri","status":$status,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","cache":"$upstream_cache_status",'
        '"bytes_sent":$bytes_sent,"request_length":$request_length,'
        '"upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time",'
        '"request_id":"$request_id"}';
    access_log /var/log/nginx/access.log main;

    # Separate Security-Streams behalten IP-Adressen höchstens 30 Tage in Loki.
    log_format security escape=json '{"log_type":"security","timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr","method":"$request_method","path":"$uri",'
        '"status":$status,"request_id":"$request_id"}';
    access_log /dev/stderr security;

    sendfile        on;
    tcp_nopush     on;

    keepalive_timeout 30s;
    keepalive_requests 1000;

    include /etc/nginx/conf.d/*.conf;
}
