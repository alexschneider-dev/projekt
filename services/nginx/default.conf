add_header X-Rate-Limited $limit_req_status always;

limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=images:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=telemetry:1m rate=5r/s;

limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;

map "$request_method:$uri" $login_limit_key {
    default "";
    "POST:/api/auth/callback/credentials" $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login:10m rate=1r/s;


map $http_user_agent $blocked_bot {
    default 0;
    ~*(claudebot|seo|spider|AhrefsBot|amazon|bytespider|imagesiftbot|cohere-ai|diffbot|facebookbot|omgili|anthropic-ai|gptbot|chatgpt|ccbot|PetalBot|zgrab|GenomeCrawlerd|FlowIQLabsBot|CensysInspect) 1;
}

map $uri $blocked_scan_path {
    default 0;
    ~*(^|/)\.env([./]|$) 1;
    ~*(^|/)\.(git|svn|hg)(/|$) 1;
    ~*^/(wp-admin|wp-includes|wp-content|phpmyadmin|phpMyAdmin|cgi-bin)(/|$) 1;
    ~*^/(wp-login|xmlrpc|wp-config)\.php(/|$) 1;
}

real_ip_header proxy_protocol;
set_real_ip_from 10.253.0.0/24;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d max_size=30g use_temp_path=off;

proxy_cache_key "$scheme$request_method$server_name$request_uri";

open_file_cache max=10000 inactive=20s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;

upstream nextjs_upstream {
    zone nextjs_upstream 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server tasks.nextjs:3000 resolve;
}

brotli on;
brotli_comp_level 5;
brotli_min_length 256;

brotli_types
  text/plain
  text/css
  application/json
  application/javascript
  text/xml
  application/xml
  application/xml+rss
  image/svg+xml;

gzip off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8081 proxy_protocol default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl proxy_protocol default_server;
    http2 on;
    server_name _;

    ssl_reject_handshake on;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name www.alex-schneider-dev.de;

    ssl_certificate /etc/letsencrypt/live/alex-schneider-dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alex-schneider-dev.de/privkey.pem;

    if ($blocked_bot) { return 403; }
    if ($blocked_scan_path) { return 404; }

    return 301 https://alex-schneider-dev.de$request_uri;
}

map $upstream_http_x_nextjs_cache $bypass_cache {
    default 0;
    "MISS"  1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl proxy_protocol;
    http2 on;

    client_max_body_size 500M;
    client_body_buffer_size 20m;

    server_name alex-schneider-dev.de;

    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/alex-schneider-dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alex-schneider-dev.de/privkey.pem;

    add_header Vary "Accept-Encoding" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    if ($blocked_bot) { return 403; }
    if ($blocked_scan_path) { return 404; }

    # Grafana vertraut ausschließlich den hier gesetzten Auth-Proxy-Headern.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /_grafana_auth {
        internal;
        proxy_pass http://nextjs_upstream/api/observability/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location = /grafana { return 302 /grafana/; }
    location ^~ /grafana/ {
        auth_request /_grafana_auth;
        auth_request_set $grafana_user $upstream_http_x_webauth_user;
        auth_request_set $grafana_role $upstream_http_x_webauth_role;
        error_page 401 = @grafana_login;
        set $grafana_backend http://observability_grafana:3000;
        proxy_pass $grafana_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header X-Webauth-User $grafana_user;
        proxy_set_header X-Webauth-Role $grafana_role;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache off;

        # Frühe Browser-Abbrüche nicht an Dashboard- und Datenabfragen weitergeben.
        # Authentifizierung bleibt geerbt; andere APIs und Live behalten ihr Verhalten.
        # Große Antworten können beim späteren Schreiben trotzdem abbrechen.
        location ~ ^/grafana/(?:api/ds/query$|d/|d-solo/|$) {
            set $grafana_backend http://observability_grafana:3000;
            proxy_pass $grafana_backend$request_uri;
            proxy_ignore_client_abort on;
        }
    }
    location @grafana_login { return 302 /login; }

    location = /collect {
        limit_except POST { deny all; }
        limit_req zone=telemetry burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        set $faro_backend http://observability_alloy:12347;
        proxy_pass $faro_backend/collect;
        proxy_ignore_client_abort on;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache off;
        proxy_read_timeout 5s;
    }

    location /api/ {
        limit_req zone=login burst=2 nodelay;
        limit_req zone=mylimit burst=50 nodelay;
        limit_req_status 429;
        add_header X-Rate-Limited $limit_req_status always;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";

        proxy_set_header Accept-Encoding "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /_next/image {
        limit_req zone=images burst=150 nodelay;
        limit_req_status 429;
        add_header X-Rate-Limited $limit_req_status always;

        proxy_cache STATIC;
        proxy_cache_valid 365d;
        proxy_cache_lock on;

        add_header X-Nextjs-Cache $upstream_http_x_nextjs_cache always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_pass http://nextjs_upstream;

        proxy_set_header Accept-Encoding "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_cache_bypass $http_x_nextjs_cache;
        proxy_no_cache     $http_x_nextjs_cache;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control;
    }

    location /_next/ {
        limit_req zone=mylimit burst=50 nodelay;
        limit_req_status 429;
        add_header X-Rate-Limited $limit_req_status always;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        proxy_set_header Accept-Encoding "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ~* ^/_next/static/.*\.(js|css|woff2)$ {
        limit_req zone=assets burst=300 nodelay;
        limit_req_status 429;
        add_header X-Rate-Limited $limit_req_status always;

        proxy_cache STATIC;
        proxy_cache_valid 365d;

        proxy_pass http://nextjs_upstream;

        proxy_set_header Accept-Encoding "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }


    location / {
        limit_req zone=mylimit burst=300 nodelay;
        limit_req_status 429;
        add_header X-Rate-Limited $limit_req_status always;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 8081 proxy_protocol;
    server_name alex-schneider-dev.de www.alex-schneider-dev.de;

    if ($blocked_bot) { return 403; }
    if ($blocked_scan_path) { return 404; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://alex-schneider-dev.de$request_uri;
    }
}

server {
    listen 8080;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location = /health {
        return 200 "OK\n";
    }

    location / {
        return 404;
    }
}
