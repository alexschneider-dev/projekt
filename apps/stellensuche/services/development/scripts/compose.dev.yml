services:
  redis:
    image: redis:7-alpine
    container_name: redis-projekt
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data_dev_projekt:/data
    networks:
      - nextjs_dev

  nextjs-projekt:
    profiles: ["dev"]
    build:
      context: ../../..
      dockerfile: services/development/Dockerfile-dev
    image: projekt:${PROJEKT_DEV_VERSION}
    container_name: nextjs-projekt
    restart: unless-stopped
    user: "0:0"
    working_dir: /app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://stellensuche_app:${STELLENSUCHE_DATABASE_PASSWORD}@postgres-projekt:5432/postgres?schema=stellensuche&connection_limit=10&pool_timeout=50&connect_timeout=10
      REDIS_URL: redis://redis:6379
    volumes:
      # Compose Watch überträgt Quellcode für native Linux-Dateiereignisse.
      - type: bind
        source: ../../../.env.local
        target: /app/.env.local
        read_only: true
        bind:
          create_host_path: false
    develop:
      watch:
        - action: sync
          path: ../../..
          target: /app
          initial_sync: true
          ignore:
            - .git/
            - .next/
            - node_modules/
            - services/
            - production/
            - tools/fast-glob/
            - tools/minimatch-compat/
            - tools/picomatch-secure/
            - prisma/
            - prisma.config.ts
            - .env
            - .env.*
            - package.json
            - package-lock.json
        - action: rebuild
          path: ../../../package.json
        - action: rebuild
          path: ../../../package-lock.json
        - action: rebuild
          path: ../../migration/package.json
        - action: rebuild
          path: ../../../tools/fast-glob
        - action: rebuild
          path: ../../../tools/minimatch-compat
        - action: rebuild
          path: ../../../tools/picomatch-secure
        - action: rebuild
          path: ../Dockerfile-dev
        - action: rebuild
          path: ../../../prisma
        - action: rebuild
          path: ../../../prisma.config.ts
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npm run dev -- --port 3000 --hostname 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/stellensuche').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
    networks:
      nextjs_dev:
        aliases: [nextjs]

  jobs:
    profiles: ["jobs"]
    build:
      context: ../../..
      dockerfile: services/Dockerfile
      target: jobs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stellensuche_app:${STELLENSUCHE_DATABASE_PASSWORD}@postgres-projekt:5432/postgres?schema=stellensuche
    networks:
      - nextjs_dev


  stellensuche-nginx:
    build:
      context: ../../nginx
    image: projekt-stellensuche-nginx-dev:${PROJEKT_DEV_VERSION:-1.00}
    restart: unless-stopped
    networks:
      - nextjs_dev

  stellensuche-haproxy:
    build:
      context: ../../haproxy
    image: projekt-stellensuche-haproxy-dev:${PROJEKT_DEV_VERSION:-1.00}
    restart: unless-stopped
    networks:
      - nextjs_dev

networks:
  nextjs_dev:
    external: true
    name: nextjs_dev

volumes:
  redis_data_dev_projekt:
