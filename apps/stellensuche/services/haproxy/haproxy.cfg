global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend app
    bind :8080
    default_backend app_nginx

backend app_nginx
    server nginx stellensuche-nginx:8080 check resolvers docker init-addr none
