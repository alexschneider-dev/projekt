# Anmeldelimits gehören ausschließlich dieser Anwendung.
map_hash_bucket_size 128;
map "$request_method:$uri" $marketplace_login_limit_key {
    default "";
    "POST:/marketplace/api/auth/callback/credentials" $http_x_real_ip;
    "POST:/marketplace/api/registration" $http_x_real_ip;
    "POST:/marketplace/api/registration/resend" $http_x_real_ip;
    "POST:/marketplace/api/registration/verify" $http_x_real_ip;
}
limit_req_zone $marketplace_login_limit_key zone=marketplace_login:10m rate=1r/s;

server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location = /proxy-health { return 200 "OK\n"; }
    location ^~ /marketplace/socket.io/ {
        set $socket_backend http://marketplace-websocket:3010;
        proxy_pass $socket_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location / {
        limit_req zone=marketplace_login burst=2 nodelay;
        limit_req_status 429;
        set $app_backend http://marketplace:3001;
        proxy_pass $app_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
