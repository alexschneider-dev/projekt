name: marketplace-websocket-tests
services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: isolated-websocket-test
    ports: ["127.0.0.1:55441:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
