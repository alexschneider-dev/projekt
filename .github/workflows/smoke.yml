name: Bereitstellung prüfen

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Vollständige Adresse der Staging- oder Produktionsumgebung"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Öffentliche Seiten und Weiterleitung prüfen
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: npm run test:smoke
