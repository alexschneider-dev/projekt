name: Marketplace – Build, Migration und Bereitstellung

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release-Version, zum Beispiel 1.00
        required: true
        type: string
      deploy:
        description: Nach dem Build den vorbereiteten Marketplace bereitstellen
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: projekt-marketplace-production
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/marketplace-tests.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Version prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Marketplace-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: apps/marketplace
          file: apps/marketplace/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_BASE_PATH=/marketplace
          tags: |
            ghcr.io/alexschneider-dev/projekt-marketplace:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-marketplace:${{ github.sha }}
          cache-from: type=gha,scope=marketplace
          cache-to: type=gha,mode=max,scope=marketplace
      - name: Marketplace-Migrationsimage bauen
        uses: docker/build-push-action@v6
        with:
          context: apps/marketplace
          file: apps/marketplace/services/migration/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexschneider-dev/projekt-marketplace-migration:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-marketplace-migration:${{ github.sha }}
          cache-from: type=gha,scope=marketplace-migration
          cache-to: type=gha,mode=max,scope=marketplace-migration

      - name: marketplace-nginx bauen
        uses: docker/build-push-action@v6
        with:
          context: apps/marketplace/services/nginx
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/alexschneider-dev/projekt-marketplace-nginx:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-marketplace-nginx:${{ github.sha }}

      - name: Nginx-Image auf Sicherheitslücken prüfen
        uses: ./.github/actions/audit-nginx
        with:
          image: ghcr.io/alexschneider-dev/projekt-marketplace-nginx:${{ github.sha }}

      - name: Geprüftes Nginx-Image veröffentlichen
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker push "ghcr.io/alexschneider-dev/projekt-marketplace-nginx:$VERSION"
          docker push "ghcr.io/alexschneider-dev/projekt-marketplace-nginx:$REVISION"

      - name: marketplace-haproxy bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: apps/marketplace/services/haproxy
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexschneider-dev/projekt-marketplace-haproxy:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-marketplace-haproxy:${{ github.sha }}

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    uses: ./.github/workflows/shared-deploy-service.yml
    with:
      service: marketplace
      version: ${{ inputs.version }}
    secrets: inherit
