name: Infrastruktur – Observability

on:
  push:
    branches:
      - main
    paths:
      - infrastructure/observability/**
      - apps/stellensuche/lib/observability/**
      - apps/stellensuche/app/api/observability/**
      - apps/stellensuche/components/observability/**
      - infrastructure/nginx/**
      - infrastructure/observability/loki-image/**
      - apps/stellensuche/instrumentation.ts
      - .github/workflows/infrastructure-observability.yml
      - infrastructure/security/audit_policy.py
  workflow_dispatch:
    inputs:
      deploy:
        description: Nach abgeschlossener Server-Vorbereitung bereitstellen
        type: boolean
        default: false
  pull_request:
    paths:
      - infrastructure/observability/**
      - apps/stellensuche/lib/observability/**
      - apps/stellensuche/app/api/observability/**
      - apps/stellensuche/components/observability/**
      - infrastructure/nginx/**
      - infrastructure/observability/loki-image/**
      - apps/stellensuche/instrumentation.ts
      - .github/workflows/infrastructure-observability.yml
      - infrastructure/security/audit_policy.py

permissions:
  contents: read

jobs:
  validate:
    outputs:
      images: ${{ steps.image-matrix.outputs.images }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/stellensuche/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prüfwerkzeuge installieren
        run: pip install PyYAML==6.0.3
      - name: Gewünschte Observability-Images erfassen
        id: image-matrix
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          from pathlib import Path
          import yaml


          sys.path.insert(0, "infrastructure/security")
          from audit_policy import image_matrix


          config = yaml.safe_load(Path("infrastructure/observability/compose.swarm.yml").read_text())
          images = image_matrix({
              "observability_" + name: service["image"]
              for name, service in config["services"].items()
          })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("images=" + json.dumps(images) + "\n")
          PYTHON
      - uses: docker/setup-buildx-action@v3
      - name: Loki-Patch bauen und Upstream-Regressionstests ausführen
        uses: docker/build-push-action@v6
        with:
          context: infrastructure/observability/loki-image
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: ghcr.io/alexschneider-dev/projekt-loki:3.6.22-projekt.1
          cache-from: type=gha,scope=projekt-loki
          cache-to: type=gha,mode=max,scope=projekt-loki
      - name: Loki-Image auf Sicherheitslücken prüfen
        uses: ./.github/actions/audit-image
        with:
          image: ghcr.io/alexschneider-dev/projekt-loki:3.6.22-projekt.1
      - name: Konfiguration und Sicherungslogik prüfen
        run: |
          bash infrastructure/observability/validate.sh
          python -m unittest discover -s infrastructure/observability -p 'test_*.py'
      - name: Anwendung prüfen
        working-directory: apps/stellensuche
        run: |
          npm ci
          npx prisma generate
          npm run check
          node --experimental-strip-types --test testing/observability.test.mjs testing/grafana-access.test.mjs testing/sharp-metrics.test.mjs
      - name: Grafana-Provisionierung und Nginx-Zugriff prüfen
        run: |
          python infrastructure/observability/test-grafana-integration.py
          docker build -t projekt-observability-nginx-check infrastructure/nginx
          python infrastructure/observability/test-nginx-integration.py
          python infrastructure/observability/test-grafana-cancellation-integration.py
          python -u infrastructure/observability/test-grafana-query-timeout-integration.py
      - name: Logabfragen und Klassifikation prüfen
        run: |
          python infrastructure/observability/test-loki-query-integration.py
          python infrastructure/observability/test-query-classification-integration.py
      - name: PostgreSQL-Wiederherstellung prüfen
        run: python infrastructure/observability/test-postgres-integration.py
      - name: Wiederherstellung aus S3 prüfen
        run: python infrastructure/observability/test-storage-integration.py

      - name: Bei der Image-Registry anmelden
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Geprüftes Loki-Image veröffentlichen
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/alexschneider-dev/projekt-loki:3.6.22-projekt.1

  audit-images:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/audit-image
        with:
          image: ${{ matrix.image }}
          report-only: ${{ matrix.report_only }}


  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs:
      - validate
      - audit-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: projekt-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH konfigurieren
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Geprüfte Monitoring-Version installieren
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -Eeuo pipefail
          target="${PROD_USER}@${PROD_HOST}"
          ssh_opts=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_dir=$(ssh "${ssh_opts[@]}" "$target" 'mktemp -d /tmp/projekt-observability.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/projekt-observability\.[a-zA-Z0-9]+$ ]]
          trap 'ssh "${ssh_opts[@]}" "$target" "rm -rf -- ${remote_dir}"' EXIT
          scp "${ssh_opts[@]}" -r infrastructure/observability/. "$target:$remote_dir/"
          ssh "${ssh_opts[@]}" "$target" \
            "sudo -n /usr/local/lib/projekt-deploy/install-observability-release.sh '$remote_dir'"

      - name: Laufende Image-Digests sichern
        uses: ./.github/actions/capture-image-inventory
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
