name: Nginx bauen und bereitstellen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "1.02"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: projekt-nginx-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: $VERSION"
            exit 1
          fi

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nginx-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./services/nginx
          file: ./services/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexschneider-dev/nginx-projekt:${{ inputs.version }}
            ghcr.io/alexschneider-dev/nginx-projekt:${{ github.sha }}
          cache-from: type=gha,scope=nginx-projekt
          cache-to: type=gha,mode=max,scope=nginx-projekt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment: Production

    steps:
      - name: SSH konfigurieren
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Auf Produktion deployen
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /usr/local/lib/projekt-deploy/deploy.sh nginx '${VERSION}'"

      - name: Website prüfen
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            --retry 20 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 5 \
            --max-time 15 \
            https://alex-schneider-dev.de/ \
            >/dev/null

          echo "✅ Produktion ist erreichbar"
