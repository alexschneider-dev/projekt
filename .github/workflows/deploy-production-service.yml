name: Produktionsservice bereitstellen

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: projekt-production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Eingaben prüfen
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$SERVICE" =~ ^(nextjs|nginx)$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]

      - name: SSH konfigurieren
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - uses: ./.github/actions/sync-production
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}

      - name: Datenbankmigration ausführen
        if: inputs.service == 'nextjs'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /usr/local/lib/projekt-deploy/migrate.sh '${VERSION}'"

      - name: Auf Produktion deployen
        env:
          SERVICE: ${{ inputs.service }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /usr/local/lib/projekt-deploy/deploy.sh '${SERVICE}' '${VERSION}'"

      - name: Website prüfen
        if: inputs.service == 'nextjs' || inputs.service == 'nginx'
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            --retry 20 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 5 \
            --max-time 15 \
            https://alex-schneider-dev.de/ \
            >/dev/null

          echo "✅ Produktion ist erreichbar"
