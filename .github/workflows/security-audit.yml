name: Abhängigkeiten auf Sicherheitslücken prüfen

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/stellensuche

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bekannte Sicherheitslücken prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm audit --package-lock-only --include=dev --audit-level=low 2>&1 | tee "$RUNNER_TEMP/npm-audit.txt"

      - name: Prüfergebnis zusammenfassen
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/npm-audit.txt" ]]; then
            {
              echo '## Sicherheitsprüfung der Abhängigkeiten'
              echo ''
              echo '```text'
              cat "$RUNNER_TEMP/npm-audit.txt"
              echo '```'
              echo ''
              echo 'Sicherheitsbefunde lassen diesen Job fehlschlagen und blockieren die Bereitstellung. Paketänderungen vor der Übernahme prüfen und testen.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
