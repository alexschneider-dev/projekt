name: Infrastruktur – Nginx

on:
  workflow_dispatch:
    inputs:
      version:
        description: "1.11"
        required: true
        type: string
      deploy:
        description: "Nach dem Build auf Produktion deployen"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: projekt-nginx-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: $VERSION"
            exit 1
          fi

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nginx-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./infrastructure/nginx
          file: ./infrastructure/nginx/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/alexschneider-dev/nginx-projekt:${{ inputs.version }}
            ghcr.io/alexschneider-dev/nginx-projekt:${{ github.sha }}
          cache-from: type=gha,scope=nginx-projekt
          cache-to: type=gha,mode=max,scope=nginx-projekt

      - name: Proxy-Zugriff und Verbindungsabbrüche prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker tag "ghcr.io/alexschneider-dev/nginx-projekt:$VERSION" projekt-observability-nginx-check:latest
          python3 infrastructure/observability/test-grafana-cancellation-integration.py
          python3 infrastructure/observability/test-nginx-integration.py

      - name: Nginx-Image auf Sicherheitslücken prüfen
        uses: ./.github/actions/audit-image
        with:
          image: ghcr.io/alexschneider-dev/nginx-projekt:${{ github.sha }}

      - name: Geprüftes Nginx-Image veröffentlichen
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker push "ghcr.io/alexschneider-dev/nginx-projekt:$VERSION"
          docker push "ghcr.io/alexschneider-dev/nginx-projekt:$REVISION"

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    uses: ./.github/workflows/shared-deploy-service.yml
    with:
      service: nginx
      version: ${{ inputs.version }}
    secrets: inherit
