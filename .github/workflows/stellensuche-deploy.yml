name: Stellensuche – Build, Migration und Bereitstellung

on:
  workflow_dispatch:
    inputs:
      version:
        description: "1.37"
        required: true
        type: string
      deploy:
        description: "Nach dem Build auf Produktion deployen"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: projekt-nextjs-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/stellensuche

jobs:
  audit:
    permissions:
      contents: read
    uses: ./.github/workflows/shared-security-audit.yml

  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/stellensuche-tests.yml
    with:
      full: true
      browser_matrix: false

  build:
    needs:
      - audit
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: $VERSION"
            exit 1
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/stellensuche/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Adapter für die Dateisuche prüfen
        run: npm run test:glob

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript prüfen
        run: npm run typecheck


      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrations-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./apps/stellensuche
          file: ./apps/stellensuche/services/migration/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/alexschneider-dev/projekt-migration:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-migration:${{ github.sha }}
          cache-from: type=gha,scope=projekt-migration
          cache-to: type=gha,mode=max,scope=projekt-migration

      - name: Stellenimport-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./apps/stellensuche
          file: ./apps/stellensuche/services/Dockerfile
          target: jobs
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/alexschneider-dev/projekt-jobs:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-jobs:${{ github.sha }}
          cache-from: type=gha,scope=projekt-jobs
          cache-to: type=gha,mode=max,scope=projekt-jobs

      - name: Next.js-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./apps/stellensuche
          file: ./apps/stellensuche/services/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexschneider-dev/projekt:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt:${{ github.sha }}
          cache-from: type=gha,scope=projekt-nextjs
          cache-to: type=gha,mode=max,scope=projekt-nextjs

      - name: stellensuche-nginx bauen
        uses: docker/build-push-action@v6
        with:
          context: apps/stellensuche/services/nginx
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/alexschneider-dev/projekt-stellensuche-nginx:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-stellensuche-nginx:${{ github.sha }}

      - name: Nginx-Image auf Sicherheitslücken prüfen
        uses: ./.github/actions/audit-nginx
        with:
          image: ghcr.io/alexschneider-dev/projekt-stellensuche-nginx:${{ github.sha }}

      - name: Geprüftes Nginx-Image veröffentlichen
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker push "ghcr.io/alexschneider-dev/projekt-stellensuche-nginx:$VERSION"
          docker push "ghcr.io/alexschneider-dev/projekt-stellensuche-nginx:$REVISION"

      - name: stellensuche-haproxy bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: apps/stellensuche/services/haproxy
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexschneider-dev/projekt-stellensuche-haproxy:${{ inputs.version }}
            ghcr.io/alexschneider-dev/projekt-stellensuche-haproxy:${{ github.sha }}

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    uses: ./.github/workflows/shared-deploy-service.yml
    with:
      service: nextjs
      version: ${{ inputs.version }}
    secrets: inherit

  deploy-jobs:
    if: ${{ inputs.deploy }}
    needs: deploy
    uses: ./.github/workflows/shared-deploy-service.yml
    with:
      service: jobs
      version: ${{ inputs.version }}
    secrets: inherit
