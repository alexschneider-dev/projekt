global
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend http
    bind :80
    default_backend nginx_http

frontend https
    bind :443
    default_backend nginx_https

backend nginx_http
    server nginx nginx-projekt:80 check resolvers docker init-addr none send-proxy-v2

backend nginx_https
    server nginx nginx-projekt:443 check resolvers docker init-addr none send-proxy-v2
