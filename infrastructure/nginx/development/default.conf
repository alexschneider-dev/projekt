# Next.js ruft Debug-Endpunkte und Overlay-Schriften ohne basePath auf. Die aufrufende Seite
# bestimmt die Anwendung; unbekannte Referer erhalten keine Weiterleitung.
map $http_referer $devtools_backend {
    default "";
    ~^https?://[^/]+/stellensuche(?:/|$) http://stellensuche-haproxy:8080;
    ~^https?://[^/]+/marketplace(?:/|$) http://marketplace-haproxy:8080;
}

add_header X-Rate-Limited $limit_req_status always;

limit_req_zone $binary_remote_addr zone=mylimit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=otp_zone:10m rate=1r/s;


real_ip_header proxy_protocol;
real_ip_recursive on;
set_real_ip_from 127.0.0.1;       
set_real_ip_from 172.16.0.0/12;
 

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d max_size=30g use_temp_path=off;

proxy_cache_key "$scheme$request_method$host$request_uri";

open_file_cache max=10000 inactive=20s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;

upstream nextjs_upstream {
    zone nextjs_upstream 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server stellensuche-haproxy:8080 resolve; 
}

gzip on;
gzip_types
  text/plain
  text/html
  text/css
  application/json
  application/javascript
  text/xml
  application/xml
  application/xml+rss
  text/javascript
  image/svg+xml;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;

map $upstream_http_x_nextjs_cache $bypass_cache {
    default 0;
    "MISS"  1;
}


server {
    listen 443 ssl proxy_protocol default_server;
    listen [::]:443 ssl proxy_protocol default_server;

    server_name localhost;

    ssl_certificate /etc/nginx/fullchain.pem;
    ssl_certificate_key /etc/nginx/privkey.pem;
  
    client_max_body_size 500M;
    client_body_buffer_size 20m;

    keepalive_timeout 65;
    keepalive_requests 100;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",event=>event.waitUntil(self.registration.unregister().then(()=>caches.keys()).then(keys=>Promise.all(keys.filter(key=>key.startsWith("projekt-offline-")).map(key=>caches.delete(key))))));';
    }

    location = /__nextjs_original-stack-frames {
        if ($devtools_backend = "") { return 404; }
        proxy_pass $devtools_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location ^~ /__nextjs_font/ {
        if ($devtools_backend = "") { return 404; }
        proxy_pass $devtools_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    include /etc/nginx/grafana.inc;
    include /etc/nginx/stellensuche.inc;
    include /etc/nginx/marketplace.inc;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/landing;
        add_header Cache-Control "no-store" always;
    }

    location = /landing/styles.css {
        root /usr/share/nginx;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }

}

server {
    listen 80 proxy_protocol;
    listen [::]:80 proxy_protocol;
    server_name localhost;

    location / {
        return 301 https://localhost$request_uri;
    }
}
