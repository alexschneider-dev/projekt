add_header X-Rate-Limited $limit_req_status always;

limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=images:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=telemetry:1m rate=5r/s;

limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;



map $http_user_agent $blocked_bot {
    default 0;
    ~*(claudebot|seo|spider|AhrefsBot|amazon|bytespider|imagesiftbot|cohere-ai|diffbot|facebookbot|omgili|anthropic-ai|gptbot|chatgpt|ccbot|PetalBot|zgrab|GenomeCrawlerd|FlowIQLabsBot|CensysInspect) 1;
}

map $uri $blocked_scan_path {
    default 0;
    ~*(^|/)\.env([./]|$) 1;
    ~*(^|/)\.(git|svn|hg)(/|$) 1;
    ~*^/(wp-admin|wp-includes|wp-content|phpmyadmin|phpMyAdmin|cgi-bin)(/|$) 1;
    ~*^/(wp-login|xmlrpc|wp-config)\.php(/|$) 1;
}

# Formular-POSTs und Server Actions auf Seiten bleiben gesperrt; APIs sind separat erreichbar.
map $uri $app_page_path {
    default 0;
    ~^/(marketplace|stellensuche)(/(?!api(?:/|$)).*)?$ 1;
}
map "$request_method:$app_page_path" $app_page_method_blocked {
    default 0;
    ~^(GET|HEAD): 0;
    ~:1$ 1;
}

real_ip_header proxy_protocol;
set_real_ip_from 10.253.0.0/24;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d max_size=30g use_temp_path=off;

proxy_cache_key "$scheme$request_method$server_name$request_uri";

open_file_cache max=10000 inactive=20s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;

upstream nextjs_upstream {
    zone nextjs_upstream 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server stellensuche-haproxy:8080 resolve;
}

brotli on;
brotli_comp_level 5;
brotli_min_length 256;

brotli_types
  text/plain
  text/css
  application/json
  application/javascript
  text/xml
  application/xml
  application/xml+rss
  image/svg+xml;

gzip off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8081 proxy_protocol default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl proxy_protocol default_server;
    http2 on;
    server_name _;

    ssl_reject_handshake on;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name www.alex-schneider-dev.de;

    ssl_certificate /etc/letsencrypt/live/alex-schneider-dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alex-schneider-dev.de/privkey.pem;

    if ($blocked_bot) { return 403; }
    if ($blocked_scan_path) { return 404; }

    return 301 https://alex-schneider-dev.de$request_uri;
}

map $upstream_http_x_nextjs_cache $bypass_cache {
    default 0;
    "MISS"  1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl proxy_protocol;
    http2 on;

    client_max_body_size 500M;
    client_body_buffer_size 20m;

    server_name alex-schneider-dev.de;

    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/alex-schneider-dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alex-schneider-dev.de/privkey.pem;

    add_header Vary "Accept-Encoding" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    if ($blocked_bot) { return 403; }
    if ($blocked_scan_path) { return 404; }

    if ($app_page_method_blocked) { return 405; }

    # Grafana vertraut ausschließlich den hier gesetzten Auth-Proxy-Headern.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/grafana.inc;

    location = /collect {
        limit_except POST { deny all; }
        limit_req zone=telemetry burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        set $faro_backend http://observability_alloy:12347;
        proxy_pass $faro_backend/collect;
        proxy_ignore_client_abort on;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache off;
        proxy_read_timeout 5s;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",event=>event.waitUntil(self.registration.unregister().then(()=>caches.keys()).then(keys=>Promise.all(keys.filter(key=>key.startsWith("projekt-offline-")).map(key=>caches.delete(key))))));';
    }

    include /etc/nginx/stellensuche.inc;
    include /etc/nginx/marketplace.inc;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/landing;
        add_header Cache-Control "no-store" always;
    }

    location = /landing/styles.css {
        root /usr/share/nginx;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }

}

server {
    listen 80;
    listen [::]:80;
    listen 8081 proxy_protocol;
    server_name alex-schneider-dev.de www.alex-schneider-dev.de;

    if ($blocked_bot) { return 403; }
    if ($blocked_scan_path) { return 404; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://alex-schneider-dev.de$request_uri;
    }
}

server {
    listen 8080;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location = /health {
        return 200 "OK\n";
    }

    location / {
        return 404;
    }
}
