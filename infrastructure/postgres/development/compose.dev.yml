name: projekt-postgres-dev
services:
  postgres:
    image: postgres:17
    container_name: postgres-projekt
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Administratorpasswort in der PostgreSQL-Konfiguration setzen}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ..:/opt/projekt-postgres:ro
    networks:
      - nextjs_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  nextjs_dev:
    external: true
    name: nextjs_dev

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:-scripts_postgres_data_dev_projekt}
