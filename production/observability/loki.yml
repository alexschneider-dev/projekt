auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
schema_config:
  configs:
  - from: 2024-01-01
    store: tsdb
    object_store: s3
    schema: v13
    index:
      prefix: index_
      period: 24h
storage_config:
  object_prefix: projekt/production/loki/
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  aws:
    endpoint: ${LOKI_S3_ENDPOINT}
    region: ${LOKI_S3_REGION}
    bucketnames: ${LOKI_S3_BUCKET}
    s3forcepathstyle: true
    insecure: false
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
limits_config:
  split_queries_by_interval: 0s
  max_query_series: 10000
  retention_period: 0s
  retention_stream:
  - selector: '{log_type="security"}'
    priority: 1
    period: 720h
  max_query_lookback: 0s
  max_query_length: 744h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
analytics:
  reporting_enabled: false
querier:
  max_concurrent: 2
ingester:
  wal:
    replay_memory_ceiling: 128MB
