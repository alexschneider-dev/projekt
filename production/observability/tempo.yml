server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
ingester:
  max_block_duration: 5m
query_frontend:
  max_batch_size: 1
  search:
    concurrent_jobs: 2
  trace_by_id:
    concurrent_shards: 2
querier:
  max_concurrent_queries: 2
  frontend_worker:
    frontend_address: 127.0.0.1:9095
compactor:
  compaction:
    block_retention: 2160h
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: ${TEMPO_S3_ENDPOINT}
      region: ${TEMPO_S3_REGION}
      prefix: projekt/production/tempo
      insecure: false
      forcepathstyle: true
usage_report:
  reporting_enabled: false
