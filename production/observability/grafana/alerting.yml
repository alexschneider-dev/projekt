apiVersion: 1
groups:
- orgId: 1
  name: production
  folder: Projekt
  interval: 1m
  rules:
  - uid: target-down
    title: Telemetrie-Ziel nicht erreichbar
    condition: C
    for: 3m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
      team: operations
    annotations:
      summary: Telemetrie-Ziel nicht erreichbar
      description: 'Betroffenen Dienst, Ressourcen und Verbindungen prüfen. Vorgehen:
        production/observability/README.md.'
    data:
    - refId: A
      datasourceUid: prometheus-live
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: up == bool 0
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
