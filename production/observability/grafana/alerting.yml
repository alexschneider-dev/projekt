  - uid: http-errors
    title: 'Next.js: Fehleranteil über 2 %'
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
      team: operations
    annotations:
      summary: 'Next.js: Fehleranteil über 2 %'
      description: 'Betroffenen Dienst, Ressourcen und Verbindungen prüfen. Vorgehen:
        production/observability/README.md.'
    data:
    - refId: A
      datasourceUid: prometheus-live
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (sum(rate(app_http_request_duration_seconds_count{status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(app_http_request_duration_seconds_count[5m])), 0.001)
          > bool 0.02) and (sum(increase(app_http_request_duration_seconds_count[5m]))
          > 100)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
