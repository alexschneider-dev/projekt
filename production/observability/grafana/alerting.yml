            type: last
            params: []
          type: query
  - uid: http-p95
    title: 'Next.js: p95 über einer Sekunde'
    condition: C
    for: 10m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
      team: operations
    annotations:
      summary: 'Next.js: p95 über einer Sekunde'
      description: 'Betroffenen Dienst, Ressourcen und Verbindungen prüfen. Vorgehen:
        production/observability/README.md.'
    data:
    - refId: A
      datasourceUid: prometheus-live
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (histogram_quantile(0.95, sum by (le, route) (rate(app_http_request_duration_seconds_bucket[5m])))
          > bool 1) and on(route) (sum by(route)(increase(app_http_request_duration_seconds_count[5m]))
          > 100)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
