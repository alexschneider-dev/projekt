version: "3.9"

services:
  nextjs:
    image: ${NEXTJS_IMAGE}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - node
      - server.js

    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      OBSERVABILITY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://observability_alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - projekt_net

    volumes:
      - nextjs_cache:/app/.next/cache/images

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://localhost:3000/
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: any
        delay: 5s
        window: 30s

      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  nginx:
    image: ${NGINX_IMAGE}
    stop_signal: SIGQUIT
    stop_grace_period: 140s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - projekt_net
      - frontend
      - grafana_proxy

    volumes:
      - nginx_cache:/var/cache/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.role == manager

      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: any
        delay: 5s

      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  postgres:
    image: ${POSTGRES_IMAGE}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - postgres

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - projekt_net

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.role == manager

      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

      restart_policy:
        condition: any
        delay: 5s

      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M


  redis:
    image: ${REDIS_IMAGE}

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - projekt_net

    volumes:
      - redis_data:/data

    deploy:
      replicas: 1

      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any
        delay: 5s

      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  grafana_proxy:
    external: true
    name: projekt_grafana_proxy

  frontend:
    external: true
    name: projekt_frontend

  projekt_net:
    external: true

volumes:
  nextjs_cache:
    external: true

  nginx_cache:
    external: true

  postgres_data:
    external: true

  redis_data:
    external: true
