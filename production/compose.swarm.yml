version: "3.9"

services:
  nextjs:
    image: ${NEXTJS_IMAGE}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - node
      - server.js

    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      OBSERVABILITY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://observability_alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_VERSION: ${NEXTJS_IMAGE}

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - projekt_net

    volumes:
      - nextjs_cache:/app/.next/cache/images

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://localhost:3000/stellensuche/
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: any
        delay: 5s
        window: 30s

      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M


  marketplace:
    image: ${MARKETPLACE_IMAGE:-ghcr.io/alexschneider-dev/projekt-marketplace:initial}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - node
      - server.js
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
      OBSERVABILITY_ENABLED: "true"
      METRICS_PORT: "9465"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://observability_alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_VERSION: ${MARKETPLACE_IMAGE:-unbekannt}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - projekt_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/marketplace/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  marketplace-websocket:
    image: ${MARKETPLACE_WEBSOCKET_IMAGE:-ghcr.io/alexschneider-dev/projekt-marketplace-websocket:initial}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command: ["node", "index.mjs"]
    environment:
      NODE_ENV: production
      PORT: "3010"
      BASE_PATH: /marketplace
    networks:
      - projekt_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  stellensuche-nginx:
    image: ${STELLENSUCHE_NGINX_IMAGE:-ghcr.io/alexschneider-dev/projekt-stellensuche-nginx:1.00}
    networks:
      - projekt_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  stellensuche-haproxy:
    image: ${STELLENSUCHE_HAPROXY_IMAGE:-ghcr.io/alexschneider-dev/projekt-stellensuche-haproxy:1.00}
    networks:
      - projekt_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  marketplace-nginx:
    image: ${MARKETPLACE_NGINX_IMAGE:-ghcr.io/alexschneider-dev/projekt-marketplace-nginx:1.00}
    networks:
      - projekt_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  marketplace-haproxy:
    image: ${MARKETPLACE_HAPROXY_IMAGE:-ghcr.io/alexschneider-dev/projekt-marketplace-haproxy:1.00}
    networks:
      - projekt_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  jobs:
    image: ${JOBS_IMAGE}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - node
      - scripts/jobs/run.mjs
    environment:
      NODE_ENV: production
    networks:
      - projekt_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 30s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  nginx:
    image: ${NGINX_IMAGE}
    stop_signal: SIGQUIT
    stop_grace_period: 140s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

    networks:
      - projekt_net
      - frontend
      - grafana_proxy

    volumes:
      - nginx_cache:/var/cache/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.role == manager

      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: any
        delay: 5s

      resources:
        limits:
          memory: 2G
        reservations:
          memory: 128M

  postgres:
    image: ${POSTGRES_IMAGE}
    entrypoint:
      - /bin/sh
      - /production-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - postgres

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - projekt_net

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.role == manager

      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

      restart_policy:
        condition: any
        delay: 5s

      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M


  redis:
    image: ${REDIS_IMAGE}

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - projekt_net

    volumes:
      - redis_data:/data

    deploy:
      replicas: 1

      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any
        delay: 5s

      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  grafana_proxy:
    external: true
    name: projekt_grafana_proxy

  frontend:
    external: true
    name: projekt_frontend

  projekt_net:
    external: true

volumes:
  nextjs_cache:
    external: true

  nginx_cache:
    external: true

  postgres_data:
    external: true

  redis_data:
    external: true
