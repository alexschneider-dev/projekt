global
    log stdout format raw local0
    maxconn 10000
    hard-stop-after 120s

defaults
    mode tcp
    timeout connect 2s
    timeout client 1h
    timeout server 1h
    retries 3

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 0s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s

frontend http
    bind :80
    default_backend nginx_http

frontend https
    bind :443
    default_backend nginx_https

# Der vollständige Dienstname verbindet die getrennten Stacks eindeutig.
backend nginx_http
    balance roundrobin
    server-template nginx 4 tasks.projekt_nginx:8081 check inter 1s fall 2 rise 1 resolvers docker init-addr none resolve-prefer ipv4 send-proxy-v2

backend nginx_https
    balance roundrobin
    server-template nginx 4 tasks.projekt_nginx:8443 check inter 1s fall 2 rise 1 resolvers docker init-addr none resolve-prefer ipv4 send-proxy-v2

listen health
    bind 127.0.0.1:8404
    mode http
    http-request return status 200 content-type text/plain string OK
